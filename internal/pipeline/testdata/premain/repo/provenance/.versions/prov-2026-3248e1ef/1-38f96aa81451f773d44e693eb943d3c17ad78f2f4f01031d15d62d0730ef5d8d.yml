  title: freeq-lite › Leaving
  type: imprint
  created_at: "2026-11-19"
  author: test
  intent: |-
    freeq-lite › Leaving
    - [REQUIREMENT] `QUIT` or `QUIT :<reason>` closes the connection: the server sends `ERROR :Closing link` and then closes it
    - [REQUIREMENT] Everyone who shared a channel with the user receives `:<prefix> QUIT :<reason>` once, with `Client quit` as the reason when none was given
    - [REQUIREMENT] A connection that drops without `QUIT` is treated the same way, with `Connection closed` as the reason
    - [REQUIREMENT] After a user leaves, their nick is free again and they are no longer a member of any channel
  affected_scope:
    - leaving.go
