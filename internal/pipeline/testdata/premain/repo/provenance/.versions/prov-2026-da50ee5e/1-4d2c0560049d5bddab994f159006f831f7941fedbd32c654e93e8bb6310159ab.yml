content:
  id: prov-2026-da50ee5e
  title: freeq-lite › Channels
  type: imprint
  created_at: "2026-11-19"
  author: test
  intent: |-
    freeq-lite › Channels
    - [REQUIREMENT] A channel name must start with `#`, be 2 to 32 characters long, and contain no spaces, commas or control characters
    - [REQUIREMENT] Channel names are matched ignoring case: `#Room` and `#room` are the same channel, which keeps the name it was created with
    - [REQUIREMENT] `JOIN <channel>` adds the user to the channel, creating it if it does not exist
    - [REQUIREMENT] When a user joins, `:<prefix> JOIN <channel>` is sent to every member of the channel, including the user who joined
    - [REQUIREMENT] After joining, the joiner receives `:freeq-lite 353 <nick> = <channel> :<names>` followed by `:freeq-lite 366 <nick> <channel> :End of /NAMES list`, where names are the members' nicks sorted alphabetically and separated by single spaces
    - [REQUIREMENT] Joining a channel the user is already in must send nothing and change nothing
    - [REQUIREMENT] An invalid channel name is answered with `:freeq-lite 403 <nick> <channel> :No such channel`
    - [REQUIREMENT] `PART <channel>` removes the user; `:<prefix> PART <channel>` is sent to every member including the user who left
    - [REQUIREMENT] `PART <channel> :<reason>` sends `:<prefix> PART <channel> :<reason>` instead
    - [REQUIREMENT] Parting a channel the user is not in is answered with `:freeq-lite 442 <nick> <channel> :You're not on that channel`
    - [REQUIREMENT] The server must forget a channel as soon as it has no members
    - [REQUIREMENT] `NAMES <channel>` is answered with the same 353 and 366 lines a joiner receives; for a channel that does not exist, only the 366 line is sent
  affected_scope:
    - channels.go
