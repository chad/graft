intent: |-
  freeq-lite › Registration
  - [CONSTRAINT] A connection registers by sending `NICK <nick>` and `USER <user> 0 * :<real name>`, in either order
  - [REQUIREMENT] Once both have been received, the server sends `:freeq-lite 001 <nick> :Welcome to freeq-lite <nick>`
  - [REQUIREMENT] A nick must be 1 to 16 characters, start with a letter, and contain only letters, digits, `_` and `-`
  - [REQUIREMENT] An invalid nick is answered with `:freeq-lite 432 * <nick> :Erroneous nickname`
  - [DEFINITION] Nicks are unique ignoring case; a nick already in use is answered with `:freeq-lite 433 * <nick> :Nickname is already in use`
  - [REQUIREMENT] Before registration, any command other than `NICK`, `USER`, `PING` and `QUIT` is answered with `:freeq-lite 451 * :You have not registered`
  - [REQUIREMENT] After registration, `NICK <new>` changes the nick: the server sends `:<old prefix> NICK <new>` to the user and to everyone who shares a channel with them, each person once
  - [DEFINITION] A user's prefix is defined as `<nick>!<user>@freeq-lite`
constraints:
  - A connection registers by sending `NICK <nick>` and `USER <user> 0 * :<real name>`, in either order
